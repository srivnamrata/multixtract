name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Primary test matrix (3.9–3.12, Ubuntu) ──────────────────────────────────
  # Installs core + dev only on PR; heavy format extras added on push to main
  # so PR authors get fast feedback without waiting for PyMuPDF/python-pptx etc.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # PRs: core + dev only (fast).  Pushes to main: add format extras.
      - name: Install dependencies (PR — core + dev)
        if: github.event_name == 'pull_request'
        run: pip install -e ".[dev]" pytest-cov

      - name: Install dependencies (main — core + dev + format extras)
        if: github.event_name != 'pull_request'
        run: pip install -e ".[dev,pdf,docx,pptx,xlsx]" pytest-cov

      - name: Lint
        run: ruff check src tests

      - name: Type-check
        run: mypy src/multixtract --ignore-missing-imports --no-error-summary

      - name: Compile check (syntax + import safety)
        run: python -m compileall -q src examples

      - name: Example import safety
        run: |
          python -c "import examples.usage_example; print('usage_example: import-safe')"
          python -c "import examples.quickstart;   print('quickstart:    import-safe')"

      - name: Test with coverage
        run: pytest --cov=multixtract --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: .coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Cross-platform sanity check (3.11, all three OSes) ─────────────────────
  # Catches path-separator bugs, missing system deps, and OS-specific import
  # failures without duplicating the full Python-version matrix.
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + core extras
        run: pip install -e ".[dev,pdf,docx,pptx,xlsx]" pytest

      - name: Run tests
        run: pytest --tb=short -q

  # ── Provider import smoke tests ─────────────────────────────────────────────
  # Validates that each optional extra installs cleanly and its public symbols
  # are importable without a GPU, API key, or network call.
  smoke-providers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - name: openai
            import: "from multixtract.providers import OpenAIVisionModel, OpenAIEmbedder"
          - name: azure
            import: >-
              from multixtract.providers import AzureOpenAIVisionModel,
              AzureOpenAIEmbedder;
              from multixtract.providers.storage import AzureBlobStore
          - name: "pdf,docx,pptx,xlsx"
            import: >-
              from multixtract.extractors import (
              PdfExtractor, DocxExtractor, PptxExtractor, ExcelExtractor)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install extra — ${{ matrix.extra.name }}
        run: pip install -e ".[${{ matrix.extra.name }}]"

      - name: Import smoke — ${{ matrix.extra.name }}
        run: python -c "${{ matrix.extra.import }}"

  # ── Dependency vulnerability scan ──────────────────────────────────────────
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install package (all extras except heavy ML models)
        run: pip install -e ".[pdf,docx,pptx,xlsx,openai,azure]"

      - name: Upgrade setuptools to patched version
        run: pip install --upgrade "setuptools>=83.0.0"

      - name: Run vulnerability audit
        run: pip-audit --skip-editable --desc

  # ── Build-from-sdist smoke test ─────────────────────────────────────────────
  # Catches missing files, import errors, or metadata problems that only surface
  # when installing from the published artifact rather than the editable tree.
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check dist artifacts
        run: twine check dist/*

      - name: Install from wheel in a clean venv
        run: |
          python -m venv /tmp/install-test
          /tmp/install-test/bin/pip install dist/*.whl
          /tmp/install-test/bin/python -c "
          import multixtract
          print('version:', multixtract.__version__)
          from multixtract import extract_document, chunk_document, Pipeline
          from multixtract.filters import ImageFilterPipeline
          from multixtract.interfaces import VisionResult, PipelineConfig
          print('core import: OK')
          "

  # ── Integration tests (heavy optional extras) ──────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + format extras
        run: pip install -e ".[pdf,docx,pptx,xlsx]" pytest-cov

      - name: Run integration tests
        run: pytest tests/integration -q

  # ── Benchmark smoke (fast, low-resource) ────────────────────────────────────
  # Runs the benchmark script in --smoke mode: processes each fixture once and
  # asserts wall-clock time is below a generous ceiling. No GPU required.
  benchmarks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + format extras
        run: pip install -e ".[pdf,docx,pptx,xlsx]"

      - name: Run benchmark smoke
        run: python benchmarks/run_benchmarks.py --smoke
