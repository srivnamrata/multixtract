name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. The more context you provide, the easier
        it is to evaluate fit and priority.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the limitation or gap you're hitting.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or other approaches.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Extraction (PDF / DOCX / PPTX / XLSX)
        - Vision provider
        - Embedder provider
        - Storage backend
        - CLI
        - Filters / image pipeline
        - Chunking
        - CI / packaging
        - Documentation
        - Other
    validations:
      required: true
