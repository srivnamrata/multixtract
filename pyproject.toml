[build-system]
# Pin build deps so source/editable installs are reproducible everywhere. pathspec>=0.12
# is required because hatchling reads .gitignore via pathspec.GitIgnoreSpec (added in 0.10);
# some environments (e.g. DBR 13.3) ship pathspec 0.9 and break the editable build with
# `module 'pathspec' has no attribute 'GitIgnoreSpec'`.
requires = ["hatchling>=1.21", "pathspec>=0.12"]
build-backend = "hatchling.build"

[project]
name = "multixtract"
version = "0.1.3"
description = "Vendor-neutral PDF/document extraction: text, tables, and vision-described images, chunked and embedded for search & RAG."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Namrata Srivastava", email = "srivnamrata@yahoo.co.in" }]
keywords = [
    "pdf", "docx", "pptx", "xlsx", "epub",
    "extraction", "ocr", "chunking", "embeddings",
    "rag", "retrieval-augmented-generation",
    "vision", "gpt-4o", "multimodal",
    "llm", "azure", "openai",
    "document-ai", "document-processing",
    "table-extraction", "text-extraction",
    "azure-ai-search", "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    # Audiences
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    # License
    "License :: OSI Approved :: MIT License",
    # Python versions
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    # Topics
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Multimedia :: Graphics :: Capture",
    # Environment
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Core stays tiny: only the image-filter pipeline deps. Format parsers and
# cloud SDKs are optional extras so users install only what they need.
dependencies = [
    "Pillow>=10.0",
    "ImageHash>=4.3",
]

[project.optional-dependencies]
# ── Per-format extractors (install only the formats you need) ──────────
pdf = ["PyMuPDF>=1.23", "pdfplumber>=0.10"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=0.6.21"]
xlsx = ["openpyxl>=3.1"]
html = ["beautifulsoup4>=4.12"]
rtf = ["striprtf>=0.0.26"]
epub = ["ebooklib>=0.18", "beautifulsoup4>=4.12"]
# Optional: decode JPEG-XR / HD Photo (.wdp) images embedded in pptx/xlsx.
# EMF/WMF/SVG vector images additionally need a system LibreOffice install.
imaging = ["imagecodecs>=2023.1.23"]
# ── Local / offline vision model (heavy; CUDA GPU strongly recommended) ─
# Upper bounds track tested major versions; bump after compatibility testing.
llama = ["transformers>=4.45,<6.0", "torch>=2.1,<3.0", "accelerate>=0.27,<2.0"]
# Qwen2.5-VL — recommended local model for document/chart understanding (2025)
qwen2vl = ["transformers>=4.49,<6.0", "torch>=2.1,<3.0", "accelerate>=0.27,<2.0"]
# SmolVLM — lightweight (2.2B) CPU-friendly alternative, no trust_remote_code
smolvlm = ["transformers>=4.49,<6.0", "torch>=2.1,<3.0"]
# ── Vendor providers ───────────────────────────────────────────────────
tiktoken = ["tiktoken>=0.7"]
openai = ["openai>=1.57.0,<4.0"]
azure = ["openai>=1.57.0,<4.0", "azure-identity>=1.15,<2.0", "azure-storage-blob>=12.19,<13.0"]
# ── Tooling ────────────────────────────────────────────────────────────
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.4", "build>=1.2", "twine>=5.0",
       "mkdocs-material>=9.5", "mkdocs-include-markdown-plugin>=6.0",
       "mypy>=1.10", "types-Pillow>=10.0"]
# Everything: all formats + imaging + Azure provider.
all = ["multixtract[pdf,docx,pptx,xlsx,html,rtf,epub,imaging,openai,azure,llama,qwen2vl,smolvlm]"]

[project.urls]
Homepage = "https://github.com/srivnamrata/multixtract"
Documentation = "https://srivnamrata.github.io/multixtract/"
Issues = "https://github.com/srivnamrata/multixtract/issues"
Changelog = "https://github.com/srivnamrata/multixtract/blob/main/CHANGELOG.md"

[project.scripts]
multixtract = "multixtract.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multixtract"]
artifacts = ["src/multixtract/py.typed"]

[tool.hatch.build.targets.sdist]
# Be explicit so sdist builds are deterministic and don't depend on VCS (.gitignore)
# file selection at build time.
include = ["src/multixtract", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Lines that cannot be exercised without specific hardware or optional
# heavyweight dependencies (GPU, full HuggingFace model weights) are excluded
# from the coverage report.  The exclusion patterns match whole logical
# branches, not individual statements, so source code stays annotation-free.
exclude_lines = [
    # Standard pragma
    "pragma: no cover",
    # Abstract / protocol stubs
    "raise NotImplementedError",
    # GPU-dependent model loading (llama, qwen2vl, smolvlm) — requires CUDA
    # hardware and HuggingFace model weights not available in CI.
    "AutoProcessor\\.from_pretrained",
    "MllamaForConditionalGeneration\\.from_pretrained",
    "Qwen2_5_VLForConditionalGeneration\\.from_pretrained",
    "AutoModelForVision2Seq\\.from_pretrained",
    # Device / dtype selection only reachable on GPU runners
    "if self\\.device == .cuda.",
    "if load_in_4bit:",
    "load_kwargs\\[.device_map.\\] = .auto.",
]
