  <rect x="190" y="572" width="300" height="36" rx="9" fill="#1e2433" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="340" y="595" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="600">BlobStore  ·  LocalDisk · Azure Blob · S3 · BYO</text>

  <!-- Legend -->
  <text x="340" y="632" text-anchor="middle" fill="#4b5563" font-size="10">Every interface is structural — implement analyze() / embed() / put_bytes() to plug in any provider</text>
