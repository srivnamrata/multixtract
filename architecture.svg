  <text x="340" y="82" text-anchor="middle" fill="#6b7280" font-size="10.5">PDF · DOCX · PPTX · XLSX · EPUB · HTML · RTF · EML</text>

  <!-- Arrow 1→2 -->
  <line x1="340" y1="88" x2="340" y2="106" stroke="#3b82f6" stroke-width="1.8"/>
