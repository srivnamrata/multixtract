<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="680" height="640" rx="12" fill="#0f1117"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="700">multixtract — pipeline architecture</text>

  <!-- Row 1: Input -->
