  <rect x="270" y="196" width="140" height="34" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
  <text x="340" y="218" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">Tables</text>

  <rect x="490" y="196" width="140" height="34" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
